<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄罗斯方块 · Game Dev Base</title>
  <meta name="description" content="在浏览器里玩俄罗斯方块：旋转、消行、升级，挑战最高分。" />
  <meta name="theme-color" content="#0a0e1a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230ea5e9'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='32' text-anchor='middle' fill='white'%3E🧱%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="progress" aria-hidden="true"></div>

  <header>
    <div class="wrap">
      <nav aria-label="主导航">
        <a href="index.html" class="brand">Game<span> Dev Base</span></a>
        <button class="menu-btn" id="menuBtn" aria-label="展开菜单" aria-expanded="false">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="index.html">首页</a>
          <a href="bomber.html">炸弹人</a>
          <a href="tank.html">坦克大战</a>
          <a href="sim.html">模拟经营</a>
          <a href="tetris.html">俄罗斯方块</a>
          <a href="g2048.html">2048</a>
          <a href="memory.html">记忆翻牌</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="top">
    <section id="tetris">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="eyebrow">Play</span>
          <h2>俄罗斯方块</h2>
          <p class="section-sub">方向键左右移动、↑ 旋转、↓ 加速、空格直接落下，P 暂停。</p>
        </div>
        <div class="game-shell reveal" id="tetrisShell">
          <button type="button" class="game-quit" aria-label="退出全屏">✕</button>
          <div class="game-hud">
            <span>得分 <b id="tetrisScore">0</b></span>
            <span>行数 <b id="tetrisLines">0</b></span>
            <span>等级 <b id="tetrisLevel">1</b></span>
            <span class="next-label">下一个 <canvas id="tetrisNext" width="100" height="60" aria-label="下一个方块预览"></canvas></span>
            <button type="button" id="tetrisPause">⏸ 暂停</button>
            <button type="button" class="game-fs-btn">⛶ 全屏游玩</button>
          </div>
          <div class="game-stage">
            <canvas id="tetrisCanvas" width="300" height="600" tabindex="0" aria-label="俄罗斯方块游戏画面"></canvas>
            <div class="game-overlay show" id="tetrisOverlay">
              <strong id="tetrisOverlayTitle">俄罗斯方块</strong>
              <span id="tetrisOverlayText">把方块拼成完整的一行即可消除得分，速度会随等级提升。</span>
              <button class="btn btn-primary" id="tetrisOverlayBtn">开始游戏</button>
            </div>
          </div>
          <div class="game-touch">
            <div class="dpad">
              <button type="button" data-act="rotate" aria-label="旋转">⟳</button>
              <div class="dpad-row">
                <button type="button" data-act="left" aria-label="左">◀</button>
                <button type="button" data-act="down" aria-label="下">▼</button>
                <button type="button" data-act="right" aria-label="右">▶</button>
              </div>
            </div>
            <button type="button" class="bomb-btn" data-act="drop">⬇ 落下</button>
          </div>
          <p class="game-help">← → 移动 · ↑ 旋转 · ↓ 加速 · 空格落下 · P 暂停 · 手机可用屏幕按钮</p>
          <a class="game-back" href="index.html">← 返回游戏列表</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      © <span id="year"></span> Game Dev Base · Made with ❤️ and a lot of coffee.
    </div>
  </footer>

  <button id="toTop" aria-label="回到顶部">↑</button>
  <script src="common.js" defer></script>
  <script src="tetris.js" defer></script>
</body>
</html>
