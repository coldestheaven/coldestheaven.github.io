<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 · Game Dev Base</title>
  <meta name="description" content="在浏览器里玩 2048：方向键或滑动合并数字，挑战最高分。" />
  <meta name="theme-color" content="#0a0e1a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f59e0b'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='28' font-weight='700' text-anchor='middle' fill='white'%3E2048%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="progress" aria-hidden="true"></div>

  <header>
    <div class="wrap">
      <nav aria-label="主导航">
        <a href="index.html" class="brand">Game<span> Dev Base</span></a>
        <button class="menu-btn" id="menuBtn" aria-label="展开菜单" aria-expanded="false">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="index.html">首页</a>
          <a href="bomber.html">炸弹人</a>
          <a href="tank.html">坦克大战</a>
          <a href="sim.html">模拟经营</a>
          <a href="tetris.html">俄罗斯方块</a>
          <a href="g2048.html">2048</a>
          <a href="memory.html">记忆翻牌</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="top">
    <section id="g2048">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="eyebrow">Play</span>
          <h2>2048</h2>
          <p class="section-sub">方向键 / WASD 或在棋盘上滑动，把相同数字合并到 2048。</p>
        </div>
        <div class="game-shell reveal" id="g2048Shell">
          <button type="button" class="game-quit" aria-label="退出全屏">✕</button>
          <div class="game-hud">
            <span>得分 <b id="g2048Score">0</b></span>
            <span>最高 <b id="g2048Best">0</b></span>
            <button type="button" id="g2048Restart">↻ 重开</button>
            <button type="button" class="game-fs-btn">⛶ 全屏游玩</button>
          </div>
          <div class="game-stage">
            <div class="board2048" id="board2048" role="grid" aria-label="2048 棋盘"></div>
            <div class="game-overlay show" id="g2048Overlay">
              <strong id="g2048OverlayTitle">2048</strong>
              <span id="g2048OverlayText">相同数字相撞会合并翻倍，目标凑出 2048。最高分保存在本地。</span>
              <button class="btn btn-primary" id="g2048OverlayBtn">开始游戏</button>
            </div>
          </div>
          <p class="game-help">方向键 / WASD 移动 · 手机在棋盘上滑动</p>
          <a class="game-back" href="index.html">← 返回游戏列表</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      © <span id="year"></span> Game Dev Base · Made with ❤️ and a lot of coffee.
    </div>
  </footer>

  <button id="toTop" aria-label="回到顶部">↑</button>
  <script src="common.js" defer></script>
  <script src="game2048.js" defer></script>
</body>
</html>
