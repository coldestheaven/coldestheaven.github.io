<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>炸弹人 · Game Dev Base</title>
  <meta name="description" content="在浏览器里玩炸弹人：放炸弹、炸砖块、躲爆炸，消灭所有敌人。" />
  <meta name="theme-color" content="#0a0e1a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f8cff'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='32' text-anchor='middle' fill='white'%3E💣%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bgFractal" aria-hidden="true"></canvas>
  <div id="progress" aria-hidden="true"></div>

  <header>
    <div class="wrap">
      <nav aria-label="主导航">
        <a href="index.html" class="brand">Game<span> Dev Base</span></a>
        <button class="menu-btn" id="menuBtn" aria-label="展开菜单" aria-expanded="false">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="index.html">首页</a>
          <a href="bomber.html">炸弹人</a>
          <a href="tank.html">坦克大战</a>
          <a href="sim.html">模拟经营</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="top">
    <section id="game">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="eyebrow">Play</span>
          <h2>炸弹人</h2>
          <p class="section-sub">放炸弹、炸砖块、躲爆炸，清理掉所有敌人即可进入下一关。</p>
        </div>
        <div class="game-shell reveal" id="gameShell">
          <button type="button" class="game-quit" id="quitFs" aria-label="退出全屏">✕</button>
          <div class="game-hud">
            <span>关卡 <b id="gLevel">1</b></span>
            <span>得分 <b id="gScore">0</b></span>
            <span>生命 <b id="gLives">3</b></span>
            <span>炸弹 <b id="gBomb">1</b></span>
            <span>火力 <b id="gFire">2</b></span>
            <button type="button" class="game-fs-btn" id="fsBtn">⛶ 全屏游玩</button>
          </div>
          <div class="game-stage">
            <canvas id="gameCanvas" width="480" height="416" tabindex="0" aria-label="炸弹人游戏画面"></canvas>
            <div class="game-overlay show" id="gameOverlay">
              <strong id="overlayTitle">炸弹人</strong>
              <span id="overlayText">WASD / 方向键移动、空格放炸弹；手机用下方方向键和 💣 按钮。炸开砖块、消灭所有敌人 —— 小心别把自己炸到！</span>
              <button class="btn btn-primary" id="overlayBtn">开始游戏</button>
            </div>
          </div>
          <div class="game-touch">
            <div class="dpad">
              <button type="button" data-dir="up" aria-label="上">▲</button>
              <div class="dpad-row">
                <button type="button" data-dir="left" aria-label="左">◀</button>
                <button type="button" data-dir="down" aria-label="下">▼</button>
                <button type="button" data-dir="right" aria-label="右">▶</button>
              </div>
            </div>
            <button type="button" class="bomb-btn" id="touchBomb">💣 放炸弹</button>
          </div>
          <p class="game-help">WASD / 方向键移动 · 空格放炸弹 · 手机可用屏幕方向键 · F 火力 / B 炸弹数 / S 加速</p>
          <a class="game-back" href="index.html">← 返回游戏列表</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      © <span id="year"></span> Game Dev Base · Made with ❤️ and a lot of coffee.
    </div>
  </footer>

  <button id="toTop" aria-label="回到顶部">↑</button>
  <script src="common.js" defer></script>
  <script src="bomber.js" defer></script>
</body>
</html>
