<body>
  <canvas id="bgFractal" aria-hidden="true"></canvas>
  <div id="progress" aria-hidden="true"></div>

  <header>
    <div class="wrap">
      <nav aria-label="主导航">
        <a href="index.html" class="brand">Game<span> Dev Base</span></a>
        <button class="menu-btn" id="menuBtn" aria-label="展开菜单" aria-expanded="false">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="index.html">首页</a>
          <a href="bomber.html">炸弹人</a>
          <a href="snake.html">贪吃蛇</a>
          <a href="breakout.html">打砖块</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="top">
    <section id="home" class="home">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="eyebrow">Arcade</span>
          <h2>游戏列表</h2>
          <p class="section-sub">点开就能玩，支持电脑键盘与手机触屏。</p>
        </div>
        <div class="game-list">
          <a class="game-card reveal" href="bomber.html">

            <div>
              <h3>炸弹人</h3>
              <p>放置炸弹炸开砖块，消灭所有敌人，别忘了躲开自己的爆炸。</p>
            </div>
            <span class="game-play">开始 →</span>
          </a>
          <a class="game-card reveal" href="snake.html">
            <div class="game-cover">🐍</div>
            <div>
              <h3>贪吃蛇</h3>
              <p>吃食物变长，别撞到墙和自己。速度会越来越快。</p>
            </div>
            <span class="game-play">开始 →</span>
          </a>
          <a class="game-card reveal" href="breakout.html">
            <div class="game-cover">🧱</div>
            <div>
              <h3>打砖块</h3>
              <p>移动挡板接住小球，敲碎全部砖块，闯过一关又一关。</p>
            </div>
            <span class="game-play">开始 →</span>
          </a>
        </div>
      </div>
