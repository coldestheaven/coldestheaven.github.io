<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坦克大战 · Game Dev Base</title>
  <meta name="description" content="在浏览器里玩坦克大战：消灭敌军，炸开砖墙，守住基地。" />
  <meta name="theme-color" content="#0a0e1a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2322c55e'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='32' text-anchor='middle' fill='white'%3E🛠️%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bgFractal" aria-hidden="true"></canvas>
  <div id="progress" aria-hidden="true"></div>

  <header>
    <div class="wrap">
      <nav aria-label="主导航">
        <a href="index.html" class="brand">Game<span> Dev Base</span></a>
        <button class="menu-btn" id="menuBtn" aria-label="展开菜单" aria-expanded="false">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="index.html">首页</a>
          <a href="bomber.html">炸弹人</a>
          <a href="tank.html">坦克大战</a>
          <a href="sim.html">模拟经营</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="top">
    <section id="tank">
      <div class="wrap">
        <div class="section-head reveal">
          <span class="eyebrow">Play</span>
          <h2>坦克大战</h2>
          <p class="section-sub">消灭所有敌军坦克，别让敌人炸掉底部的基地。</p>
        </div>
        <div class="game-shell reveal" id="tankShell">
          <button type="button" class="game-quit" aria-label="退出全屏">✕</button>
          <div class="game-hud">
            <span>关卡 <b id="tankLevel">1</b></span>
            <span>得分 <b id="tankScore">0</b></span>
            <span>生命 <b id="tankLives">3</b></span>
            <span>敌军 <b id="tankLeft">7</b></span>
            <button type="button" class="game-fs-btn">⛶ 全屏游玩</button>
          </div>
          <div class="game-stage">
            <canvas id="tankCanvas" width="480" height="480" tabindex="0" aria-label="坦克大战游戏画面"></canvas>
            <div class="game-overlay show" id="tankOverlay">
              <strong id="tankOverlayTitle">坦克大战</strong>
              <span id="tankOverlayText">WASD / 方向键移动，空格发射炮弹；手机用方向键与 🔫 按钮。砖墙可炸开，钢墙打不穿。</span>
              <button class="btn btn-primary" id="tankOverlayBtn">开始游戏</button>
            </div>
          </div>
          <div class="game-touch">
            <div class="dpad">
              <button type="button" data-dir="up" aria-label="上">▲</button>
              <div class="dpad-row">
                <button type="button" data-dir="left" aria-label="左">◀</button>
                <button type="button" data-dir="down" aria-label="下">▼</button>
                <button type="button" data-dir="right" aria-label="右">▶</button>
              </div>
            </div>
            <button type="button" class="bomb-btn" id="tankFire">🔫 开炮</button>
          </div>
          <p class="game-help">方向键 / WASD 移动 · 空格开炮 · 手机可用屏幕按钮</p>
          <a class="game-back" href="index.html">← 返回游戏列表</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      © <span id="year"></span> Game Dev Base · Made with ❤️ and a lot of coffee.
    </div>
  </footer>

  <button id="toTop" aria-label="回到顶部">↑</button>
  <script src="common.js" defer></script>
  <script src="tank.js" defer></script>
</body>
</html>
